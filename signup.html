<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <h1>Daftar</h1>

      <form id="signup-form">

        <label for="firstName">Nama Depan</label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name" required />

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" minlength="3" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="nama@email.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />

        <label for="confirm-password">Ulangi Password</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" minlength="6" required />

        <button type="submit" id="signup-btn">Daftar</button>

        <p id="signup-status" class="status-message" hidden></p>
      </form>

      <p class="login-switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </div>
  </main>

  <script src="js/auth.js" defer></script>
  <script src="js/signup.js" defer></script>
</body>
</html>
